<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sinh Viên - AdminLTE 4</title>
    <!-- AdminLTE v4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper p-4">
        <div class="content-header">
            <div class="container-fluid">
                <h2 class="fw-bold text-primary">AdminLTE 4)</h2>
            </div>
        </div>

        <div class="content">
            <div class="container-fluid">
                <div class="card card-primary card-outline mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3 class="card-title m-0">Danh sách Sinh Viên</h3>
                        <button class="btn btn-success" onclick="showAddModal()">
                            <i class="bi bi-person-plus-fill"></i> Thêm Sinh Viên
                        </button>
                    </div>

                    <div class="card-body">
                        <!-- Thanh Tìm Kiếm -->
                        <div class="row mb-3">
                            <div class="col-md-5">
                                <div class="input-group">
                                    <input type="text" id="searchInput" class="form-control" placeholder="Nhập tên, mã SV, email hoặc SĐT...">
                                    <button class="btn btn-primary" type="button" onclick="loadStudents()">
                                        <i class="bi bi-search"></i> Tìm kiếm
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Bảng Dữ Liệu -->
                        <div class="table-responsive">
                            <table class="table table-bordered table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Mã SV</th>
                                        <th>Họ và Tên</th>
                                        <th>Email</th>
                                        <th>Số điện thoại</th>
                                        <th>Lớp</th>
                                        <th class="text-center" style="width: 150px;">Hành động</th>
                                    </tr>
                                </thead>
                                <tbody id="studentTableBody">
                                    <!-- AJAX render dữ liệu ở đây -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Form Thêm / Chỉnh Sửa -->
    <div class="modal fade" id="studentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalTitle">Thêm Sinh Viên</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="studentId">
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Mã Sinh Viên</label>
                        <input type="text" id="studentCode" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Họ và Tên</label>
                        <input type="text" id="fullName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Email</label>
                        <input type="email" id="email" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Số điện thoại</label>
                        <input type="text" id="phone" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Lớp</label>
                        <input type="text" id="className" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" onclick="saveStudent()">Lưu thông tin</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script AdminLTE & Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/js/adminlte.min.js"></script>

    <!-- JavaScript Gọi API -->
    <script>
        const API_URL = '/api/students';
        let studentModal;

        document.addEventListener('DOMContentLoaded', () => {
            studentModal = new bootstrap.Modal(document.getElementById('studentModal'));
            loadStudents();
        });

        // 1. Gọi API Lấy / Tìm kiếm danh sách sinh viên
        async function loadStudents() {
            const keyword = document.getElementById('searchInput').value.trim();
            const url = keyword ? `${API_URL}?keyword=${encodeURIComponent(keyword)}` : API_URL;

            try {
                const response = await fetch(url);
                const students = await response.json();
                
                const tbody = document.getElementById('studentTableBody');
                tbody.innerHTML = '';

                if (students.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Không tìm thấy sinh viên nào</td></tr>';
                    return;
                }

                students.forEach(s => {
                    tbody.innerHTML += `
                        <tr>
                            <td><span class="badge bg-secondary">${s.studentCode || ''}</span></td>
                            <td class="fw-bold">${s.fullName || ''}</td>
                            <td>${s.email || ''}</td>
                            <td>${s.phone || ''}</td>
                            <td>${s.className || ''}</td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-warning me-1" onclick="showEditModal('${s.id}')">
                                    <i class="bi bi-pencil-square"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteStudent('${s.id}')">
                                    <i class="bi bi-trash-fill"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error('Lỗi khi tải dữ liệu:', error);
            }
        }

        // 2. Mở Modal Thêm mới
        function showAddModal() {
            document.getElementById('modalTitle').innerText = 'Thêm Sinh Viên Mới';
            document.getElementById('studentId').value = '';
            document.getElementById('studentCode').value = '';
            document.getElementById('fullName').value = '';
            document.getElementById('email').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('className').value = '';
            studentModal.show();
        }

        // 3. Mở Modal Cập nhật
        async function showEditModal(id) {
            document.getElementById('modalTitle').innerText = 'Cập Nhật Sinh Viên';
            try {
                const response = await fetch(`${API_URL}/${id}`);
                const s = await response.json();

                document.getElementById('studentId').value = s.id;
                document.getElementById('studentCode').value = s.studentCode || '';
                document.getElementById('fullName').value = s.fullName || '';
                document.getElementById('email').value = s.email || '';
                document.getElementById('phone').value = s.phone || '';
                document.getElementById('className').value = s.className || '';

                studentModal.show();
            } catch (error) {
                alert('Không thể lấy thông tin sinh viên!');
            }
        }

        // 4. Gọi API POST / PUT để lưu dữ liệu
        async function saveStudent() {
            const id = document.getElementById('studentId').value;
            const studentData = {
                studentCode: document.getElementById('studentCode').value,
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                className: document.getElementById('className').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(studentData)
                });

                if (res.ok) {
                    studentModal.hide();
                    loadStudents();
                } else {
                    alert('Lưu dữ liệu thất bại!');
                }
            } catch (error) {
                console.error('Lỗi lưu dữ liệu:', error);
            }
        }

        // 5. Gọi API DELETE để xóa
        async function deleteStudent(id) {
            if (!confirm('Bạn có chắc chắn muốn xóa sinh viên này?')) return;

            try {
                const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadStudents();
                } else {
                    alert('Xóa không thành công!');
                }
            } catch (error) {
                console.error('Lỗi xóa sinh viên:', error);
            }
        }
    </script>
</body>
</html>
