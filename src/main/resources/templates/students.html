<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Sinh Viên</title>

    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        h2 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: inline-block; width: 120px; }
        .form-group input { padding: 6px; width: 250px; }
        .btn { padding: 8px 15px; cursor: pointer; text-decoration: none; display: inline-block; border-radius: 4px; }
        .btn-add { background-color: #28a745; color: white; border: none; }
        .btn-delete { background-color: #dc3545; color: white; border: none; font-size: 13px; }
    </style>
</head>
<body>

    <h2>Thêm Sinh Viên Mới</h2>
    <form th:action="@{/students/save}" th:object="${newStudent}" method="post">
        <div class="form-group">
            <label>Mã Sinh Viên:</label>
            <input type="text" th:field="*{studentCode}" required/>
        </div>
        <div class="form-group">
            <label>Họ và Tên:</label>
            <input type="text" th:field="*{fullName}" required/>
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" th:field="*{email}"/>
        </div>
        <div class="form-group">
            <label>Số Điện Thoại:</label>
            <input type="text" th:field="*{phone}"/>
        </div>
        <div class="form-group">
            <label>Lớp Học:</label>
            <input type="text" th:field="*{className}"/>
        </div>
        <button type="submit" class="btn btn-add">Lưu Sinh Viên</button>
    </form>

    <hr style="margin-top: 30px;">

    <h2>Danh Sách Sinh Viên</h2>
    <table>
        <thead>
            <tr>
                <th>Mã SV</th>
                <th>Họ Tên</th>
                <th>Email</th>
                <th>SĐT</th>
                <th>Lớp</th>
                <th>Hành Động</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="sv : ${students}">
                <td th:text="${sv.studentCode}">SV001</td>
                <td th:text="${sv.fullName}">Nguyễn Văn A</td>
                <td th:text="${sv.email}">a@gmail.com</td>
                <td th:text="${sv.phone}">0901234567</td>
                <td th:text="${sv.className}">C2024A</td>
                <td>
                    <a th:href="@{/students/delete/{id}(id=${sv.id})}" 
                       class="btn btn-delete" 
                       onclick="return confirm('Bạn có chắc chắn muốn xóa?')">Xóa</a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
